[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viessmann-modbus"
version = "0.1.0"
description = "Read a Viessmann Vitocharge / hybrid inverter (GoodWe-compatible register map) over Modbus."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "viessmann-modbus contributors" }]
keywords = ["modbus", "viessmann", "goodwe", "inverter", "solar", "home-assistant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = ["modbus-connection[tmodbus]>=4.7.0"]

[project.urls]
Homepage = "https://github.com/balloobbot/viessmann-modbus"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/viessmann_modbus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
